name: Build Android Play bundle

on:
  workflow_dispatch:
  push:
    branches: [codex/google-play-update]

concurrency:
  group: android-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Resolve the checked-in dependency versions
        run: flutter pub get --enforce-lockfile
      - name: Prepare Firebase client configuration
        run: python3 tools/android/prepare_ci_firebase.py
      - name: Build the release bundle for the existing upload key
        run: |
          test ! -e android/key.properties
          flutter build appbundle --release --no-pub
      - name: Validate the bundle and release manifest
        run: |
          mkdir -p build/android-distribution
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=build/app/outputs/bundle/release/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --module=base > build/android-distribution/AndroidManifest.xml
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle=build/app/outputs/bundle/release/app-release.aab > build/android-distribution/bundle-config.json
          python3 tools/android/inspect_bundle.py
      - name: Upload bundle awaiting signing on the release Mac
        uses: actions/upload-artifact@v4
        with:
          name: ripot-android-unsigned-${{ github.run_number }}
          path: build/android-distribution/*
          if-no-files-found: error
          retention-days: 30
