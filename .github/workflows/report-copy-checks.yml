name: Report copy and shared app checks
on:
  push:
    branches: [codex/windows-store-msix-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: report-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm audit --prefix functions
      - run: npx --yes firebase-tools@14.22.0 emulators:exec --only firestore --project demo-ripot-founders --config firebase.test.json "npm test --prefix functions"
  shared-app:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
      - run: python3 tools/web/package_release.py
      - run: python3 tools/android/prepare_ci_firebase.py
      - run: flutter build appbundle --release --no-pub
      - name: Save web build and unsigned Android bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: ripot-copy-shared-builds-${{ github.run_number }}
          path: |
            build/web-distribution
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
