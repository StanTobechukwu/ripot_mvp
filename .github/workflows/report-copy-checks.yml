name: Report copy and shared app checks
on:
  push:
    branches: [codex/windows-store-msix-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: report-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm audit --prefix functions
      - run: npx --yes firebase-tools@14.22.0 emulators:exec --only firestore --project demo-ripot-founders --config firebase.test.json "npm test --prefix functions"
  shared-app:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test --no-pub
      - name: Check Windows HTML clipboard byte offsets
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tools/testing/report_clipboard_format_test.cpp -o /tmp/report-clipboard-test
          /tmp/report-clipboard-test
      - name: Verify formatted and plain paste in Chrome
        run: |
          flutter build web --release --no-pub --target tools/testing/report_copy_preview.dart --output build/copy-preview
          npm install --prefix "$RUNNER_TEMP/ripot-browser" --no-package-lock --no-save playwright@1.58.2
          NODE_PATH="$RUNNER_TEMP/ripot-browser/node_modules" node tools/web/smoke_report_copy.cjs
      - name: Save clipboard verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripot-copy-format-check-${{ github.run_number }}
          path: build/copy-browser-check
          if-no-files-found: ignore
          retention-days: 14
      - run: flutter build web --release --no-pub
      - run: python3 tools/web/package_release.py
      - run: python3 tools/android/prepare_ci_firebase.py
      - run: flutter build appbundle --release --no-pub
      - name: Save web build and unsigned Android bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: ripot-copy-shared-builds-${{ github.run_number }}
          path: |
            build/web-distribution
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
