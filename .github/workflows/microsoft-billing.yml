name: Microsoft subscription verification
on:
  pull_request:
    paths:
      - functions/**
      - lib/features/billing/**
      - lib/features/access/**
      - windows/runner/**
      - test/features/microsoft_billing_controller_test.dart
      - .github/workflows/microsoft-billing.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npx --yes firebase-tools@14.22.0 emulators:exec --only firestore --project demo-ripot-founders --config firebase.test.json "npm test --prefix functions"
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub --dart-define=RIPOT_MICROSOFT_STORE=true
