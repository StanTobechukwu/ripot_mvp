name: Build verified web release

on:
  workflow_dispatch:
  push:
    branches: [codex/release-1.0.13-48]

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check all automated app tests
        run: flutter test
      - name: Compile the release web app
        run: flutter build web --release --no-pub
      - name: Package the web app for its existing Firebase target
        run: python3 tools/web/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ripot-web-release-${{ github.run_number }}
          path: build/web-distribution/*
          if-no-files-found: error
          retention-days: 30
