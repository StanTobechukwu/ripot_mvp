name: Export template PDF previews
on:
  pull_request:
    paths:
      - 'tools/export_template_previews.dart'
      - 'lib/features/reports/services/pdf_renderer_service.dart'
      - 'tools/landing/example_values.json'
      - 'tools/landing/render_previews.py'
      - '.github/workflows/template-preview-assets.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter test tools/export_template_previews.dart
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python3 tools/landing/render_previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: ripot-template-pdf-previews
          path: landing/y/templates/previews
          if-no-files-found: error
