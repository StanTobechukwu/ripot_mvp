name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-download
      - codex/trial-aware-report-limits

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Check out the selected branch (including its registry update)
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Test, build and package Ripot
        shell: pwsh
        run: ./tools/windows/build_windows.ps1

      - name: Verify hashes, install, launch twice and uninstall
        shell: pwsh
        env:
          RIPOT_SOURCE_COMMIT: ${{ github.sha }}
        run: ./tools/windows/check_windows_package.ps1 -ArtifactDirectory build/windows-distribution -ExpectedCommit $env:RIPOT_SOURCE_COMMIT -OutputDirectory verified

      - name: Check report saving and account prompts in the installed app
        shell: powershell
        env:
          RIPOT_SOURCE_COMMIT: ${{ github.sha }}
        run: ./tools/windows/check_installed_workflows.ps1 -ArtifactDirectory verified -OutputDirectory workflow-check -ExpectedCommit $env:RIPOT_SOURCE_COMMIT

      - name: Upload installed workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripot-windows-workflow-check-${{ github.run_number }}
          path: workflow-check/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer download
        uses: actions/upload-artifact@v4
        with:
          name: ripot-windows-installer-${{ github.run_number }}
          path: verified/Ripot-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable download
        uses: actions/upload-artifact@v4
        with:
          name: ripot-windows-portable-${{ github.run_number }}
          path: verified/Ripot-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation report, checksums and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripot-windows-validation-${{ github.run_number }}
          path: |
            verified/*.json
            verified/*.txt
            verified/*.png
          if-no-files-found: warn
          retention-days: 30
