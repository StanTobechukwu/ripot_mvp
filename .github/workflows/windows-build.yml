name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-download

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Check out the selected branch (including its registry update)
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Test, build and package Ripot
        shell: pwsh
        run: ./tools/windows/build_windows.ps1

      - name: Upload installer, portable bundle and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ripot-windows-${{ github.run_number }}
          path: build/windows-distribution/*/*
          if-no-files-found: error
          retention-days: 30
