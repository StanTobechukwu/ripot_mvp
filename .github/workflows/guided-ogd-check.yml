name: Guided OGD interaction and release checks
on:
  push:
    branches: [codex/report-data-release-20261031, codex/guided-ogd-gradings-20261108]
    paths: ['lib/**', 'test/**', 'tools/**', 'assets/reference/**', 'pubspec.yaml', '.github/workflows/guided-ogd-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tools/landing/export_additional_templates.py
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test --no-pub test/features/guided_ogd_workflow_test.dart test/features/guided_report_presentation_test.dart test/features/guided_ogd_gradings_test.dart test/features/public_template_parallel_load_test.dart test/features/public_template_recovery_test.dart test/features/additional_public_templates_test.dart test/features/public_template_catalog_test.dart
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Check real generated report text
        run: |
          pdftotext -layout build/ogd-qa/different-findings.pdf build/ogd-qa/different-findings.txt
          pdftotext -layout build/ogd-qa/normal-after-abnormal.pdf build/ogd-qa/normal-after-abnormal.txt
          pdftotext -layout build/ogd-qa/landmarks.pdf build/ogd-qa/landmarks.txt
          pdftotext -layout build/ogd-qa/hidden-landmarks.pdf build/ogd-qa/hidden-landmarks.txt
          pdftotext -layout build/ogd-qa/concise-report.pdf build/ogd-qa/concise-report.txt
          pdftotext -layout build/ogd-qa/concise-normal.pdf build/ogd-qa/concise-normal.txt
          pdftotext -layout build/ogd-qa/gradings.pdf build/ogd-qa/gradings.txt
          python3 - <<'PY'
          from pathlib import Path
          abnormal=Path('build/ogd-qa/different-findings.txt').read_text()
          normal=Path('build/ogd-qa/normal-after-abnormal.txt').read_text()
          assert 'Antrum' in abnormal and 'Body' in abnormal and 'Cardia' in abnormal
          assert '10 mm' in abnormal and '20 mm' in abnormal
          assert abnormal.index('Cardia') < abnormal.index('Body') < abnormal.index('Antrum')
          assert 'Antrum' not in normal and '20 mm' not in normal and 'Forrest' not in normal
          assert 'Normal' in normal
          landmarks=Path('build/ogd-qa/landmarks.txt').read_text()
          hidden=Path('build/ogd-qa/hidden-landmarks.txt').read_text()
          assert all(value+' cm from incisors' in landmarks for value in ['39.5','37.5','41','32.5'])
          assert '7 mm' in landmarks and '2 count' not in landmarks
          assert 'GEJ' not in hidden and '39.5' not in hidden and '32.5 cm from incisors' in hidden
          concise=' '.join(Path('build/ogd-qa/concise-report.txt').read_text().split())
          concise_normal=' '.join(Path('build/ogd-qa/concise-normal.txt').read_text().split())
          assert 'Abnormal' not in concise and 'Location:' not in concise
          assert all(prompt not in concise for prompt in ['if applicable', 'if recorded', 'if relevant', 'stomach finding', 'oesophagus finding'])
          assert concise.count('Upper oesophagus') == 1
          assert 'Midazolam' in concise and '2 mg' in concise and 'IV' in concise
          assert 'Preparation and safety' in concise and 'Consent: Obtained' in concise
          assert 'Container: A' in concise and 'Container: B' in concise
          assert 'Container: A' not in concise_normal and 'Container: B' in concise_normal
          assert 'Large (5 mm or greater)' in concise
          assert 'Red wale marks' in concise and 'Oozing' in concise and '10 mm' in concise
          gradings=Path('build/ogd-qa/gradings.txt').read_text()
          assert all(value in gradings for value in ['Prague C2M4', 'GOV2', 'IIa', 'non-bleeding visible vessel', 'EREFS oedema', 'Not assessed'])
          assert 'EREFS total' not in gradings and 'Grading guide' not in gradings
          PY
      - run: flutter test --no-pub tools/export_template_previews.dart
      - run: python3 tools/landing/render_previews.py
      - run: python3 tools/landing/build_templates.py
      - run: python3 tools/landing/verify.py
      - run: flutter build web --release --no-pub
      - run: python3 tools/web/package_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripot-ogd-verified-package
          path: |
            build/ogd-qa
            build/web-distribution
            landing
          include-hidden-files: true
          retention-days: 14
