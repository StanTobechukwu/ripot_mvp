name: Guided OGD interaction and release checks
on:
  push:
    branches: [codex/report-data-release-20261031]
    paths: ['lib/**', 'test/**', 'tools/**', 'pubspec.yaml', '.github/workflows/guided-ogd-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tools/landing/export_additional_templates.py
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test --no-pub test/features/guided_ogd_workflow_test.dart test/features/public_template_parallel_load_test.dart test/features/additional_public_templates_test.dart test/features/public_template_catalog_test.dart
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Check real generated report text
        run: |
          pdftotext -layout build/ogd-qa/different-findings.pdf build/ogd-qa/different-findings.txt
          pdftotext -layout build/ogd-qa/normal-after-abnormal.pdf build/ogd-qa/normal-after-abnormal.txt
          python3 - <<'PY'
          from pathlib import Path
          abnormal=Path('build/ogd-qa/different-findings.txt').read_text()
          normal=Path('build/ogd-qa/normal-after-abnormal.txt').read_text()
          assert 'Antrum' in abnormal and 'Body' in abnormal and 'Cardia' in abnormal
          assert '10 mm' in abnormal and '20 mm' in abnormal
          assert abnormal.index('Cardia') < abnormal.index('Body') < abnormal.index('Antrum')
          assert 'Antrum' not in normal and '20 mm' not in normal and 'Forrest' not in normal
          assert 'Normal' in normal
          PY
      - run: flutter test --no-pub tools/export_template_previews.dart
      - run: python3 tools/landing/render_previews.py
      - run: python3 tools/landing/build_templates.py
      - run: python3 tools/landing/verify.py
      - run: flutter build web --release --no-pub
      - run: python3 tools/web/package_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripot-ogd-verified-package
          path: |
            build/ogd-qa
            build/web-distribution
            landing
          include-hidden-files: true
          retention-days: 14
