name: Payment path and guided template release
on:
  push:
    branches: [codex/web-payment-path-20261112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      NO_GCE_CHECK: 'true'
      GCE_METADATA_HOST: '127.0.0.1:9'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolate tools from instance metadata
        run: |
          sudo iptables -I OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo ip6tables -I OUTPUT -d fd00:ec2::254/128 -j REJECT
          sudo iptables -C OUTPUT -d 169.254.0.0/16 -j REJECT
          sudo ip6tables -C OUTPUT -d fd00:ec2::254/128 -j REJECT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify payment lifecycle in an isolated demo emulator
        run: |
          npm ci --prefix functions
          npx --yes firebase-tools@14.22.0 emulators:exec --only firestore --project demo-ripot-founders --config firebase.test.json 'npm test --prefix functions'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - name: Verify app access, payments and preserved guided templates
        run: flutter test --no-pub --reporter expanded
      - name: Verify landing and immutable template assets
        run: |
          python3 tools/landing/build_templates.py
          python3 tools/landing/verify.py
          git diff --exit-code -- landing/y
      - name: Check landing layouts
        run: |
          npm install --prefix "$RUNNER_TEMP/ripot-browser" --no-package-lock --no-save playwright@1.58.2
          NODE_PATH="$RUNNER_TEMP/ripot-browser/node_modules" node tools/landing/smoke_template_previews.cjs
      - run: flutter build web --release --no-pub
      - run: python3 tools/web/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ripot-web-payments-1.0.28-63
          path: build/web-distribution/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-release-checks
          path: |
            build/browser-smoke
            build/ogd-qa
          retention-days: 14
