name: Report data release checks and packages
on:
  push:
    branches: [codex/report-data-release-20261031]
  pull_request:
    branches: [codex/global-backup-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test --no-pub
      - run: flutter test --no-pub tools/export_public_templates.dart
      - run: python3 tools/landing/export_additional_templates.py
      - run: flutter test --no-pub tools/export_template_previews.dart
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python3 tools/landing/render_previews.py
      - run: python3 tools/landing/build_templates.py
      - run: python3 tools/landing/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: ripot-generated-template-assets
          path: |
            landing
            pubspec.lock
          include-hidden-files: true
      - run: flutter build web --release --no-pub
      - run: python3 tools/web/package_release.py
      - run: python3 tools/android/prepare_ci_firebase.py
      - name: Build and validate unsigned Play bundle
        run: |
          test ! -e android/key.properties
          flutter build appbundle --release --no-pub
          mkdir -p build/android-distribution
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=build/app/outputs/bundle/release/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --module=base > build/android-distribution/AndroidManifest.xml
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle=build/app/outputs/bundle/release/app-release.aab > build/android-distribution/bundle-config.json
          python3 tools/android/inspect_bundle.py
          cp tools/android/Sign-Ripot.command build/android-distribution/

      - uses: actions/upload-artifact@v4
        with:
          name: ripot-reviewed-update
          path: |
            build/web-distribution
            build/android-distribution
            landing
            pubspec.lock
          include-hidden-files: true
          retention-days: 14
