name: Verify Ripot branding, templates and Registry controls
on:
  workflow_dispatch:
  push:
    branches: [codex/ripot-branding-premium-registry-controls]
permissions:
  contents: read
concurrency:
  group: ripot-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze changed code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/features/access lib/features/auth/ui/auth_screens.dart lib/features/registry lib/features/reports/data/reports_repository.dart lib/features/reports/domain/public_template_links.dart lib/features/reports/ui/report_preview_screen.dart lib/features/reports/ui/reports_list_screen.dart test/features/access test/features/registry_report_link_test.dart test/features/public_template_links_test.dart
      - name: Run all app tests
        run: flutter test --no-pub
      - name: Generate platform icons from approved artwork
        run: dart run flutter_launcher_icons
      - name: Export exact starter templates and build indexable library
        run: |
          flutter test --no-pub tools/export_public_templates.dart
          python3 tools/landing/build_templates.py
          python3 tools/landing/verify.py
      - name: Compile the updated web app
        run: flutter build web --release --no-pub
      - name: Package reviewed sources and generated assets
        run: |
          python3 tools/web/package_release.py
          mkdir -p build/refresh
          cp -R landing build/refresh/Ripot-Landing-1.0.14-49
          tar -czf build/refresh/generated-icons.tar.gz assets/ripot_icon.png android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset macos/Runner/Assets.xcassets/AppIcon.appiconset web/icons web/favicon.png windows/runner/resources/app_icon.ico
          cp -R landing/y/templates build/refresh/templates
      - uses: actions/upload-artifact@v4
        with:
          name: ripot-refresh-1.0.14-49
          path: |
            build/refresh
            build/web-distribution
          if-no-files-found: error
          retention-days: 30
