name: Check Records and Registry linked media

on:
  push:
    branches: [codex/records-registry-linked-media]
  workflow_dispatch:

concurrency:
  group: records-registry-linked-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze changed product code
        run: >
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          lib/app.dart
          lib/features/records
          lib/features/registry
          lib/features/reports/ui/report_preview_screen.dart
          lib/features/reports/ui/reports_list_screen.dart
          lib/features/update
          lib/core/platform/external_url.dart
          lib/core/platform/external_url_io.dart
          lib/core/platform/external_url_stub.dart
      - name: Run Records and Registry tests
        run: >
          flutter test --no-pub
          test/features/records_registry_linked_media_test.dart
          test/features/records_selection_review_test.dart
          test/features/records_simplification_test.dart
          test/features/registry_test.dart
          test/features/registry_dialog_test.dart
          test/features/registry_workflow_test.dart
          test/features/registry_patient_details_test.dart
          test/features/registry_editing_test.dart
          --reporter expanded
