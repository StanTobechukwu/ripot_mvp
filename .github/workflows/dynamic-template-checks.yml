name: Dynamic template checks
on:
  push:
    branches: [codex/template-adoption-pages-20261022]
  pull_request:
    paths:
      - 'lib/features/reports/**'
      - 'test/features/public_template*_test.dart'
      - 'tools/web/smoke_dynamic_template.cjs'
      - 'tools/landing/**'
      - 'landing/firebase.json'
      - '.github/workflows/dynamic-template-checks.yml'
  workflow_dispatch:
jobs:
  template-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate public templates
        run: python3 tools/landing/build_templates.py
      - name: Verify landing links and copyable examples
        run: python3 tools/landing/verify.py
      - name: Verify approved catalog integrity
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib, re
          root=pathlib.Path('landing/y/templates')
          catalog=json.loads((root/'catalog/manifest.json').read_text())
          assert catalog['schemaVersion']==1
          assert len(catalog['templates'])>=4
          slugs=set()
          for entry in catalog['templates']:
              slug=entry['slug']
              assert slug not in slugs
              slugs.add(slug)
              assert entry['status']=='approved'
              assert re.fullmatch('[a-f0-9]{16}',entry['version'])
              assert entry['url'].startswith('/templates/catalog/'+slug+'/')
              p=pathlib.Path('landing/y')/entry['url'].lstrip('/')
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==entry['sha256']
              assert hashlib.sha256(raw).hexdigest()[:16]==entry['version']
              data=json.loads(raw)
              assert data['ripotFileType']=='template'
              assert data['ripotExportVersion']==1
              assert data['template']['roots']
              page=(root/slug/'index.html').read_text()
              assert 'version='+entry['version'] in page
          print('Verified',len(slugs),'versioned public templates')
          PY
  flutter-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release
      - name: Test catalogue-only template in compiled web app
        run: |
          npm install --prefix "$RUNNER_TEMP/ripot-browser" --no-package-lock --no-save playwright@1.58.2
          NODE_PATH="$RUNNER_TEMP/ripot-browser/node_modules" node tools/web/smoke_dynamic_template.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripot-dynamic-template-browser-check
          path: build/browser-smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Package web and landing for test runs
        run: |
          python3 tools/landing/build_templates.py
          python3 tools/landing/verify.py
          python3 tools/web/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ripot-template-test-build
          path: |
            build/web-distribution/*.zip
            landing
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
